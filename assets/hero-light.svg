<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="hermes-syntax-oracle: a SyntaxError in a tool result, recover the source, tokenizer diagnosis that must agree with Python, compile-checked one-edit fix, then a verdict appended or silence"><rect width="1200" height="330" rx="16" fill="#ffffff" stroke="#d0d7de"/><text x="60" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="38" fill="#1f2328" font-weight="700" xml:space="preserve">hermes-syntax-oracle</text><text x="60" y="112" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" xml:space="preserve">Points at the bracket that broke a Python SyntaxError, and checks the fix with compile().</text><rect x="60" y="168" width="170" height="70" rx="10" fill="#f6f8fa" stroke="#cf222e" stroke-width="1.5"/><text x="145.0" y="198" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#1f2328" font-weight="700" text-anchor="middle" xml:space="preserve">SyntaxError</text><text x="145.0" y="220" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="middle" xml:space="preserve">in a tool result</text><rect x="260" y="168" width="170" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="345.0" y="198" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2328" font-weight="600" text-anchor="middle" xml:space="preserve">recover source</text><text x="345.0" y="220" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="middle" xml:space="preserve">tool args or the .py file</text><line x1="230" y1="203" x2="252.0" y2="203.0" stroke="#656d76" stroke-width="1.8"/><path d="M252.0,198.0 L260,203 L252.0,208.0 Z" fill="#656d76"/><rect x="460" y="168" width="170" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="545.0" y="198" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2328" font-weight="600" text-anchor="middle" xml:space="preserve">tokenizer</text><text x="545.0" y="220" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="middle" xml:space="preserve">must agree with Python</text><line x1="430" y1="203" x2="452.0" y2="203.0" stroke="#656d76" stroke-width="1.8"/><path d="M452.0,198.0 L460,203 L452.0,208.0 Z" fill="#656d76"/><rect x="660" y="168" width="170" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="745.0" y="198" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#1f2328" font-weight="700" text-anchor="middle" xml:space="preserve">compile()</text><text x="745.0" y="220" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="middle" xml:space="preserve">up to 160 one-char edits</text><line x1="630" y1="203" x2="652.0" y2="203.0" stroke="#656d76" stroke-width="1.8"/><path d="M652.0,198.0 L660,203 L652.0,208.0 Z" fill="#656d76"/><line x1="830" y1="188" x2="880.5" y2="168.8" stroke="#1a7f37" stroke-width="1.8"/><path d="M878.7,164.2 L888,166 L882.3,173.5 Z" fill="#1a7f37"/><rect x="890" y="136" width="250" height="60" rx="10" fill="none" stroke="#1a7f37" stroke-width="1.5"/><text x="912" y="162" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#1a7f37" font-weight="700" xml:space="preserve">✓ VERDICT APPENDED</text><text x="912" y="182" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" xml:space="preserve">where, why, fix if one compiles</text><line x1="830" y1="218" x2="881.0" y2="246.1" stroke="#656d76" stroke-width="1.8"/><path d="M883.4,241.8 L888,250 L878.6,250.5 Z" fill="#656d76"/><rect x="890" y="222" width="250" height="60" rx="10" fill="none" stroke="#d0d7de" stroke-width="1.5"/><text x="912" y="248" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#656d76" font-weight="700" xml:space="preserve">○ SILENT</text><text x="912" y="268" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" xml:space="preserve">any doubt: result passes untouched</text><text x="60" y="276" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" xml:space="preserve">source: write_file content, execute_code code, a patched .py, or a .py named in the traceback (only if it really fails to compile)</text></svg>